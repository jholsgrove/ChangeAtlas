<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*__TITLE__*/</title>
<style>
:root{--bg:#0f1419;--panel:#161c22;--line:#232a31;--fg:#d7dde3;--muted:#8a949e;--accent:#4a9eea;--badge-text:#0b0e11;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{display:flex;height:100%;position:relative}
#graph{flex:1;height:100%;background:var(--bg)}
.side{width:340px;flex:0 0 340px;border-left:1px solid var(--line);
background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.side .pad{padding:16px 18px;overflow:auto;flex:1}
h1{font-size:15px;margin:0;padding:16px 18px;border-bottom:1px solid var(--line);
letter-spacing:.02em}
h1 small{color:var(--muted);font-weight:400;font-size:12px;display:block;margin-top:2px}
.brand{display:flex;align-items:flex-start;gap:10px}
.brand > div{flex:1;min-width:0}
#logo{width:36px;height:36px;border-radius:8px;flex:0 0 36px}
#theme-toggle{background:var(--bg);color:var(--fg);border:1px solid var(--line);
border-radius:6px;padding:4px 8px;cursor:pointer;font-size:14px;line-height:1;flex:0 0 auto}
#theme-toggle:hover{border-color:var(--accent)}
.side footer{border-top:1px solid var(--line);padding:10px 18px;font-size:12px;
color:var(--muted);flex:0 0 auto}
.side footer a{color:var(--accent);text-decoration:none}
.side footer a:hover{text-decoration:underline}
.controls{padding:12px 18px;border-bottom:1px solid var(--line)}
.controls input,.controls select{width:100%;margin-bottom:8px;padding:7px 9px;
background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line);
border-radius:20px;cursor:pointer;font:inherit;font-size:12px;user-select:none;
transition:opacity .15s;background:none;color:var(--fg)}
.chip:hover{border-color:var(--accent)}
.chip.off{opacity:.35}
.chip .dot{width:10px;height:10px;border-radius:50%}
.detail h2{font-size:16px;margin:.2em 0}
.detail .meta{color:var(--muted);font-size:12px;margin-bottom:10px}
.detail .badge{display:inline-block;padding:1px 8px;border-radius:12px;font-size:11px;
color:var(--badge-text);font-weight:600}
.detail blockquote{margin:0 0 14px;padding:.5em .9em;border-left:3px solid var(--accent);
background:var(--bg);color:var(--fg);border-radius:0 6px 6px 0}
.detail h4{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted);
margin:14px 0 4px}
.detail ul{margin:0;padding-left:0;list-style:none}
.detail li{padding:3px 0}
.detail a{color:var(--accent);text-decoration:none;cursor:pointer}
.detail a:hover{text-decoration:underline}
.detail .kind{color:var(--muted);font-size:11px;margin-right:5px;
display:inline-block;min-width:74px}
.detail .guides{margin-top:6px}
.detail .guides a{display:block;padding:4px 0}
.reading{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.reading h3{font-size:15px;margin:.2em 0}
.reading a.wl{color:var(--accent);cursor:pointer}
.reading span.broken{color:var(--muted);border-bottom:1px dotted var(--muted)}
.reading .back{color:var(--muted);cursor:pointer;font-size:12px;display:inline-block;margin-bottom:8px}
.empty{color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin-top:8px}
button.reset{background:var(--bg);color:var(--fg);border:1px solid var(--line);
border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13px;width:100%}
button.reset:hover{border-color:var(--accent)}
.views{display:flex;gap:6px;margin-top:8px}
.views button{background:var(--bg);color:var(--fg);border:1px solid var(--line);
border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px}
.views button:hover{border-color:var(--accent)}
.views button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
#list-view{position:absolute;inset:0 340px 0 0;background:var(--bg);overflow:auto;
padding:16px 18px}
#list-view[hidden]{display:none}
#list-view table{width:100%;border-collapse:collapse;font-size:13px}
#list-view caption{text-align:left;color:var(--fg);font-size:15px;padding-bottom:10px}
#list-view th,#list-view td{border-bottom:1px solid var(--line);padding:6px 8px;
text-align:left;vertical-align:top}
#list-view thead th{color:var(--muted);font-size:11px;text-transform:uppercase;
letter-spacing:.04em}
#list-view a{color:var(--accent);text-decoration:none}
#list-view a:hover{text-decoration:underline}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <div id="graph" tabindex="-1"></div>
  <section id="list-view" hidden aria-label="Impacted components as a table">
    <table>
      <caption>Impacted components</caption>
      <thead><tr><th scope="col">Component</th><th scope="col">Tier</th>
        <th scope="col">Prod files</th><th scope="col">Test files</th>
        <th scope="col">Stories</th><th scope="col">Pull requests</th></tr></thead>
      <tbody id="list-view-body"></tbody>
    </table>
  </section>
  <aside class="side">
    <h1>
      <div class="brand">
        <img id="logo" alt="" width="36" height="36">
        <div>/*__TITLE__*/<small id="stats"></small></div>
        <button id="theme-toggle" type="button" aria-pressed="false"
                aria-label="Light theme">☀️</button>
      </div>
      <div class="views" role="group" aria-label="View">
        <button id="view-impact" aria-pressed="true">Impact</button>
        <button id="view-system" aria-pressed="false">System</button>
        <button id="view-list" aria-pressed="false">List</button>
      </div>
    </h1>
    <div class="controls">
      <input id="search" list="nodelist" placeholder="Search components…" aria-label="Search components" autocomplete="off">
      <datalist id="nodelist"></datalist>
      <div class="legend" id="legend"></div>
      <div class="hint">Hover a node to spotlight its links. Click a node for its stories and PRs.</div>
    </div>
    <div class="pad">
      <div class="detail" id="detail"><p class="empty">Select a node to see what it does and what it connects to.</p></div>
      <button class="reset" id="reset" style="margin-top:14px">Reset view</button>
    </div>
    <footer><a href="https://github.com/jholsgrove/ChangeAtlas" target="_blank"
      rel="noopener">ChangeAtlas on GitHub</a></footer>
  </aside>
</div>
<script>/*__VISLIB__*/</script>
<script>
// Both theme palettes (single source of colour truth, WCAG-audited per theme
// in changeatlas/palette.py). PALETTE always points at the active theme's
// palette; every colour below reads from it so applyTheme() can re-skin the
// whole report — CSS custom properties, graph nodes/edges, badges, legend.
const PALETTES = /*__PALETTES__*/;
const LOGO_LIGHT = '/*__LOGO_LIGHT__*/', LOGO_DARK = '/*__LOGO_DARK__*/';
const THEME_KEY = 'changeatlas-theme';
let theme = null;
try { theme = localStorage.getItem(THEME_KEY); } catch (e) { /* storage blocked */ }
if (theme !== 'light' && theme !== 'dark') {
  theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
let PALETTE = PALETTES[theme];

const DATA = /*__DATA__*/;
const TS = DATA.typeStyle, EL = DATA.edgeLabel;
let IMPACT;
function buildImpact() {
  IMPACT = {
    changed:    { color: PALETTE.tiers.changed.fill,    label: PALETTE.tiers.changed.label },
    touched:    { color: PALETTE.tiers.touched.fill,    label: PALETTE.tiers.touched.label },
    testOnly:   { color: PALETTE.tiers.testOnly.fill,   label: PALETTE.tiers.testOnly.label },
    peripheral: { color: PALETTE.tiers.peripheral.fill, label: PALETTE.tiers.peripheral.label },
    dimmed:     { color: PALETTE.dimmed, label: 'Untouched' },
  };
}
buildImpact();
const CHANGED = new Set(DATA.impact.changed);
const TOUCHED = new Set(DATA.impact.touched || []);
const TESTONLY = new Set(DATA.impact.testOnly || []);
const PERIPHERAL = new Set(DATA.impact.peripheral);
const stateOf = id => CHANGED.has(id) ? 'changed'
                    : TOUCHED.has(id) ? 'touched'
                    : TESTONLY.has(id) ? 'testOnly'
                    : PERIPHERAL.has(id) ? 'peripheral' : 'dimmed';
// Views: 'impact' (release shading, default), 'system' (plain architecture,
// nodes coloured by type, no release overlay), 'list' (accessible table).
let currentView = 'impact';
// Legend pill filters: a filtered tier/type is dimmed in place, never removed.
const filteredTiers = new Set(), filteredTypes = new Set();
const effectiveState = id => {
  const s = stateOf(id);
  return s !== 'dimmed' && filteredTiers.has(s) ? 'dimmed' : s;
};
const baseOpacity = id => {
  if (currentView === 'system') return filteredTypes.has(byId[id].type) ? 0.35 : 1;
  if (stateOf(id) === 'dimmed')
    return filteredTiers.has('dimmed') ? 0.12 : 0.35; // filtered untouched: near-invisible
  return effectiveState(id) === 'dimmed' ? 0.35 : 1;
};

const byId = {};
DATA.nodes.forEach(n => byId[n.id] = n);

const NEUTRAL_TYPE = { label: '?', color: '#8a949e' };
// Type colours are theme-specific (light needs darker fills for contrast):
// prefer the active palette's type_colors, fall back to the payload's
// typeStyle colour, then neutral.
function typeColor(t) {
  return (PALETTE.type_colors && PALETTE.type_colors[t])
      || (TS[t] && TS[t].color) || NEUTRAL_TYPE.color;
}
function impactNodeVisual(n) {
  const tier = PALETTE.tiers[effectiveState(n.id)]; // undefined for 'dimmed' (untouched or filtered)
  const hi = PALETTE.node_highlight_border;
  return {
    color: tier
      ? { background: tier.fill, border: tier.border,
          highlight: { background: tier.fill, border: hi } }
      : { background: IMPACT.dimmed.color, border: IMPACT.dimmed.color,
          highlight: { background: IMPACT.dimmed.color, border: hi } },
    borderWidth: tier ? 2 : 1,
    // WCAG 1.4.1: tiers are distinguished by border pattern, not colour alone.
    // Always a real object: an explicit `undefined` clobbers vis-network's
    // default shapeProperties in its options merge and crashes node rendering.
    shapeProperties: { borderDashes: tier ? tier.borderDashes : false },
    opacity: baseOpacity(n.id),
  };
}
function systemNodeVisual(n) {
  const c = filteredTypes.has(n.type) ? PALETTE.dimmed : typeColor(n.type);
  return {
    color: { background: c, border: c,
             highlight: { background: c, border: PALETTE.node_highlight_border } },
    borderWidth: 1,
    shapeProperties: { borderDashes: false },
    opacity: baseOpacity(n.id),
  };
}
const affected = id => effectiveState(id) !== 'dimmed';
function impactEdgeVisual(e) {
  return { color: (affected(e.from) && affected(e.to))
    ? { color: PALETTE.edge_affected, highlight: PALETTE.tiers.peripheral.fill, opacity: 0.9 }
    : { color: PALETTE.edge_dim, highlight: PALETTE.link, opacity: 0.4 } };
}
function systemEdgeVisual(e) {
  const clear = !filteredTypes.has(byId[e.from].type) && !filteredTypes.has(byId[e.to].type);
  return { color: clear
    ? { color: PALETTE.edge_system, highlight: PALETTE.link, opacity: 0.55 }
    : { color: PALETTE.edge_dim, highlight: PALETTE.link, opacity: 0.4 } };
}

const visNodes = new vis.DataSet(DATA.nodes.map(n => Object.assign({
  id: n.id, label: n.title,
  value: n.type === 'repo' ? 30 : (n.type === 'database' || n.type === 'messaging' ? 18 : 10),
}, impactNodeVisual(n))));
const visEdges = new vis.DataSet(DATA.edges.map((e, i) => Object.assign({
  id: 'e' + i, from: e.from, to: e.to, kind: e.kind, note: e.note || '',
}, impactEdgeVisual(e))));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
  nodes: { shape: 'dot', font: { color: PALETTE.text, size: 13, face: 'Segoe UI' },
           borderWidth: 1, scaling: { min: 8, max: 34 } },
  edges: { width: 1, smooth: { type: 'continuous' },
           arrows: { to: { enabled: true, scaleFactor: 0.45 } } },
  physics: { barnesHut: { gravitationalConstant: -8000, springLength: 110,
             springConstant: 0.03, damping: 0.4 }, stabilization: { iterations: 250 } },
  interaction: { hover: true, tooltipDelay: 120, navigationButtons: false, keyboard: false },
});

const counts = {
  changed: CHANGED.size, touched: TOUCHED.size, testOnly: TESTONLY.size,
  peripheral: PERIPHERAL.size,
  dimmed: DATA.nodes.length - CHANGED.size - TOUCHED.size - TESTONLY.size - PERIPHERAL.size,
};
function buildStats() {
  document.getElementById('stats').textContent = currentView === 'system'
    ? DATA.nodes.length + ' components · ' + DATA.edges.length + ' dependencies'
    : 'Generated ' + DATA.generated + ' · ' + counts.changed + ' changed · ' +
      counts.touched + ' touched · ' + counts.testOnly + ' test-only · ' +
      counts.peripheral + ' peripheral · ' + counts.dimmed + ' untouched';
}
const legend = document.getElementById('legend');
// Each chip is a toggle button: pressing it sends its tier/type to the dimmed
// treatment (nodes stay on the map, just recede); pressing again restores it.
function legendChip(color, text, off, onToggle) {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'chip';
  chip.setAttribute('aria-pressed', String(!off));
  if (off) chip.classList.add('off');
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = color;   // property assignment: payload colours stay inert
  chip.appendChild(dot);
  chip.appendChild(document.createTextNode(' ' + text));
  chip.addEventListener('click', onToggle);
  legend.appendChild(chip);
}
function toggleFilter(set, key) {
  if (set.has(key)) set.delete(key); else set.add(key);
  refreshVisuals();
  buildLegend();
  if (selected) spotlight(neighbours(selected)); // keep an open selection spotlit
}
function buildLegend() {
  legend.textContent = '';
  if (currentView === 'system') {
    const typeCounts = {};
    DATA.nodes.forEach(n => typeCounts[n.type] = (typeCounts[n.type] || 0) + 1);
    Object.keys(typeCounts).forEach(t => {
      const ts = TS[t] || { label: t, color: NEUTRAL_TYPE.color };
      legendChip(typeColor(t), ts.label + ' (' + typeCounts[t] + ')',
        filteredTypes.has(t), () => toggleFilter(filteredTypes, t));
    });
  } else {
    Object.keys(IMPACT).forEach(k =>
      legendChip(IMPACT[k].color, IMPACT[k].label + ' (' + counts[k] + ')',
        filteredTiers.has(k), () => toggleFilter(filteredTiers, k)));
  }
}
buildStats();
buildLegend();

// ---- search datalist ----
const dl = document.getElementById('nodelist');
DATA.nodes.slice().sort((a,b)=>a.title.localeCompare(b.title)).forEach(n => {
  const o = document.createElement('option'); o.value = n.title; dl.appendChild(o);
});

// ---- hover spotlight ----
function neighbours(id) {
  const s = new Set([id]);
  network.getConnectedNodes(id).forEach(n => s.add(n));
  return s;
}
function spotlight(keep) {
  visNodes.update(DATA.nodes.map(n =>
    ({ id: n.id, opacity: keep.has(n.id) ? 1 : 0.12 })));
}
function clearSpotlight() {
  visNodes.update(DATA.nodes.map(n => ({ id: n.id, opacity: baseOpacity(n.id) })));
}
network.on('hoverNode', p => spotlight(neighbours(p.node)));
network.on('blurNode', () => { if (!selected) clearSpotlight(); });

// ---- detail panel ----
let selected = null;
const detail = document.getElementById('detail');
function edgesFor(id) {
  const out = [], inc = [];
  visEdges.forEach(e => { if (e.from === id) out.push(e); if (e.to === id) inc.push(e); });
  return { out, inc };
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;');
}
// Only ever hand out an href for a payload URL that is actually http(s) —
// anything else (javascript:, data:, a bare string) becomes an inert "#"
// rather than an executable link. Applied in both showNode and buildListView.
function safeUrl(u) {
  return /^https?:\/\//i.test(u) ? u : '#';
}
function row(otherId, kind, note, dir) {
  const other = byId[otherId];
  const label = EL[kind] || kind;
  const arrow = dir === 'out' ? '→' : '←';
  return '<li><span class="kind">' + arrow + ' ' + label + '</span>' +
    '<a data-id="' + esc(otherId) + '">' + (other ? esc(other.title) : esc(otherId)) + '</a>' +
    (note ? ' <span class="empty">— ' + esc(note) + '</span>' : '') + '</li>';
}
function showNode(id) {
  const n = byId[id]; if (!n) return;
  selected = id;
  const { out, inc } = edgesFor(id);
  let h = '<div class="detail">';
  h += '<button type="button" class="reset" id="detail-close">Close details</button>';
  h += '<h2>' + esc(n.title) + '</h2>';
  // Unknown/future node types fall back to a plain neutral badge instead of
  // throwing on TS[n.type] being undefined.
  const typeStyle = TS[n.type] || { label: n.type, color: '#8a949e' };
  // System view: architecture only — no tier badge, no release sections below.
  const tierBadge = currentView === 'system' ? '' :
    ' <span class="badge" style="background:' + IMPACT[stateOf(id)].color + '">' +
    IMPACT[stateOf(id)].label + '</span>';
  h += '<div class="meta"><span class="badge" style="background:' + typeColor(n.type) + '">' +
       esc(typeStyle.label) + '</span>' + tierBadge +
       (n.repo ? ' &nbsp;' + esc(n.repo) : '') + '</div>';
  h += '<blockquote>' + esc(n.summary) + '</blockquote>';
  if (out.length) h += '<h4>Depends on / contains</h4><ul>' +
    out.map(e => row(e.to, e.kind, e.note, 'out')).join('') + '</ul>';
  if (inc.length) h += '<h4>Used by</h4><ul>' +
    inc.map(e => row(e.from, e.kind, e.note, 'in')).join('') + '</ul>';
  const det = currentView === 'system' ? null : DATA.details[id];
  if (det && (det.prodFiles || det.testFiles)) {
    h += '<h4>Change size</h4><ul><li>' + det.prodFiles + ' production file(s), ' +
         det.testFiles + ' test file(s) changed</li></ul>';
  }
  if (det && det.stories.length) {
    h += '<h4>Stories in this release</h4><ul>' + det.stories.map(s =>
      '<li><span class="kind">' + esc(s.type) + '</span>' +
      '<a href="' + esc(safeUrl(s.url)) + '" target="_blank">#' + s.id + ' ' + esc(s.title) + '</a></li>'
    ).join('') + '</ul>';
  }
  if (det && det.prs.length) {
    h += '<h4>Pull requests</h4><ul>' + det.prs.map(p =>
      '<li><span class="kind">' + esc(p.repo) + '</span>' +
      '<a href="' + esc(safeUrl(p.url)) + '" target="_blank">!' + p.id + ' ' + esc(p.title) + '</a></li>'
    ).join('') + '</ul>';
  }
  if (currentView !== 'system' && stateOf(id) === 'peripheral') {
    const near = network.getConnectedNodes(id).filter(o => CHANGED.has(o));
    if (near.length) {
      h += '<h4>Connected changed components</h4><ul>' + near.map(o =>
        '<li><a data-id="' + esc(o) + '">' + esc(byId[o].title) + '</a></li>').join('') + '</ul>';
    }
  }
  h += '</div>';
  detail.innerHTML = h;
  detail.querySelectorAll('a[data-id]').forEach(a =>
    a.onclick = () => focusNode(a.getAttribute('data-id')));
  const closeBtn = document.getElementById('detail-close');
  if (closeBtn) closeBtn.onclick = closeDetail;
  spotlight(neighbours(id));
  // Focus management (WCAG 2.4.3): move focus into the panel that just opened.
  detail.setAttribute('tabindex', '-1');
  detail.focus();
}
function closeDetail() {
  selected = null;
  clearSpotlight();
  detail.innerHTML = '<p class="empty">Select a node to see what it does and what it connects to.</p>';
  container.focus();
}
detail.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeDetail();
});
function focusNode(id) {
  network.selectNodes([id]);
  network.focus(id, { scale: 1.1, animation: { duration: 400 } });
  showNode(id);
}
network.on('click', p => {
  if (p.nodes.length) showNode(p.nodes[0]);
  else closeDetail();
});

// ---- search ----
document.getElementById('search').addEventListener('change', ev => {
  const v = ev.target.value.trim().toLowerCase();
  if (!v) return;
  const hit = DATA.nodes.find(n => n.title.toLowerCase() === v)
           || DATA.nodes.find(n => n.title.toLowerCase().includes(v));
  if (hit) focusNode(hit.id);
});

// ---- reset ----
document.getElementById('reset').onclick = () => {
  selected = null;
  filteredTiers.clear();
  filteredTypes.clear();
  visNodes.update(DATA.nodes.map(n => ({ id: n.id, hidden: false })));
  refreshVisuals();
  buildLegend();
  network.unselectAll();
  network.fit({ animation: { duration: 500 } });
  detail.innerHTML = '<p class="empty">Select a node to see what it does and what it connects to.</p>';
};

// ---- accessible list view (WCAG 1.1.1 / 1.4.1: non-canvas equivalent of the graph) ----
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function buildListView() {
  const tiers = [["changed","Changed"],["touched","Touched"],
                 ["testOnly","Test-only"],["peripheral","Peripheral"]];
  const body = document.getElementById("list-view-body");
  body.textContent = ""; // safe to re-enter: clear any rows from a prior throw
  for (const [key, label] of tiers) {
    // DATA.impact[key] || []: some tiers (e.g. touched/testOnly) are optional
    // on the payload, same guard as the CHANGED/TOUCHED/... Sets above.
    for (const id of DATA.impact[key] || []) {
      const d = DATA.details[id] || {stories: [], prs: [], prodFiles: 0, testFiles: 0};
      const node = DATA.nodes.find(n => n.id === id);
      const tr = document.createElement("tr");
      const links = list => list.map(x =>
        `<a href="${escapeHtml(safeUrl(x.url))}">${escapeHtml("#" + x.id + " " + x.title)}</a>`).join("<br>");
      tr.innerHTML = `<th scope="row">${escapeHtml(node ? node.title : id)}</th>` +
        `<td>${label}</td><td>${d.prodFiles}</td><td>${d.testFiles}</td>` +
        `<td>${links(d.stories)}</td><td>${links(d.prs)}</td>`;
      body.appendChild(tr);
    }
  }
}
// ---- view switching: Impact | System | List ----
const viewButtons = {
  impact: document.getElementById('view-impact'),
  system: document.getElementById('view-system'),
  list:   document.getElementById('view-list'),
};
function setView(v) {
  if (v === currentView) return;
  currentView = v;
  Object.keys(viewButtons).forEach(k =>
    viewButtons[k].setAttribute('aria-pressed', String(k === v)));
  const lv = document.getElementById('list-view');
  lv.hidden = v !== 'list';
  if (v === 'list' && !lv.dataset.built) { buildListView(); lv.dataset.built = '1'; }
  if (v !== 'list') {
    refreshVisuals();
    if (selected) showNode(selected); // re-render panel with/without release info
  }
  buildStats();
  buildLegend();
}
function refreshVisuals() {
  const system = currentView === 'system';
  const nodeVisual = system ? systemNodeVisual : impactNodeVisual;
  visNodes.update(DATA.nodes.map(n => Object.assign({ id: n.id }, nodeVisual(n))));
  visEdges.update(DATA.edges.map((e, i) => Object.assign(
    { id: 'e' + i }, system ? systemEdgeVisual(e) : impactEdgeVisual(e))));
}
viewButtons.impact.addEventListener('click', () => setView('impact'));
viewButtons.system.addEventListener('click', () => setView('system'));
viewButtons.list.addEventListener('click', () => setView('list'));

// ---- theme: dark | light (default follows prefers-color-scheme) ----
function applyTheme(t) {
  theme = t;
  PALETTE = PALETTES[t];
  buildImpact();
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty('--bg', PALETTE.bg);
  rootStyle.setProperty('--panel', PALETTE.panel_bg);
  rootStyle.setProperty('--line', PALETTE.line);
  rootStyle.setProperty('--fg', PALETTE.text);
  rootStyle.setProperty('--muted', PALETTE.muted_text);
  rootStyle.setProperty('--accent', PALETTE.link);
  rootStyle.setProperty('--badge-text', PALETTE.badge_text);
  document.getElementById('logo').src = t === 'light' ? LOGO_LIGHT : LOGO_DARK;
  const btn = document.getElementById('theme-toggle');
  btn.setAttribute('aria-pressed', String(t === 'light'));
  btn.textContent = t === 'light' ? '🌙' : '☀️';
  network.setOptions({ nodes: { font: { color: PALETTE.text } } });
  refreshVisuals();
  buildStats();
  buildLegend();
  if (selected) {
    const focused = document.activeElement;
    showNode(selected); // re-render badges/spotlight in the new theme
    if (focused && focused.id === 'theme-toggle') focused.focus();
  }
}
document.getElementById('theme-toggle').addEventListener('click', () => {
  const next = theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* storage blocked */ }
  applyTheme(next);
});
applyTheme(theme); // initial paint: CSS vars, logo, toggle state
</script>
