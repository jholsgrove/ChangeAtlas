name: Demo

# Build both fictional sample reports and publish them to GitHub Pages, so
# the README can link clickable demos that never go stale: the web shop at
# the site root and the 100-repo platform under /large/. Only the bundled
# samples are ever built here — no ADO access, no real system maps.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m changeatlas --sample
      - run: python -m changeatlas --sample large
      - name: Stage both reports as the site
        run: |
          mkdir -p site/large
          cp out/impact-sample.html site/index.html
          cp out/impact-sample-large.html site/large/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
