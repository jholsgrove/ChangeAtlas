name: Demo

# Build the fictional web-shop sample report and publish it to GitHub Pages,
# so the README can link a clickable demo that never goes stale. Only the
# bundled sample is ever built here — no ADO access, no real system maps.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m changeatlas --sample
      - name: Stage the report as the site index
        run: |
          mkdir site
          cp out/impact-sample.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
